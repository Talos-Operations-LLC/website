[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# The demo replays captured records; only map imagery uses external connections.
[[headers]]
  for = "/demo/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://server.arcgisonline.com https://services.arcgisonline.com; font-src 'self'; connect-src 'self' https://server.arcgisonline.com https://services.arcgisonline.com; worker-src 'self' blob:; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'self'"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "public, max-age=0, must-revalidate"

# /ledger was the original home page. Retired 2026-10-01: its county map now
# lives on /coverage.html, so old links land there. The bare path is listed
# too, in case the splat rule doesn't cover it.
[[redirects]]
  from = "/ledger"
  to = "/coverage.html"
  status = 301

[[redirects]]
  from = "/ledger/*"
  to = "/coverage.html"
  status = 301

[[headers]]
  for = "/demo/files/*.html"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"

[[redirects]]
  from = "/demo/workbench/*"
  to = "/demo/"
  status = 301

[[redirects]]
  from = "/demo/ld-capture/*"
  to = "/demo/"
  status = 301
