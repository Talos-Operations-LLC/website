[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# /ledger was the original home page. Retired 2026-10-01: its county map now
# lives on /coverage.html, so old links land there. The bare path is listed
# too, in case the splat rule doesn't cover it.
[[redirects]]
  from = "/ledger"
  to = "/coverage.html"
  status = 301

[[redirects]]
  from = "/ledger/*"
  to = "/coverage.html"
  status = 301
