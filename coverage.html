<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coverage — Fee Simple</title>
<link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<meta name="description" content="Which North Carolina counties Fee Simple covers today: live in production, or surveyed with bulk data mapped.">
<meta property="og:title" content="Coverage — Fee Simple">
<meta property="og:description" content="Which North Carolina counties Fee Simple covers today: live in production, or surveyed with bulk data mapped.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #E4E4E1;
    --ink: #1A1A1A;
    --mute: #6B6B6B;
    --rule: #C9C9C6;
    --accent: #1F4FD8;
    --accent-dark: #163CA8;
    --btn: #111111;
    --paper: #F4F4F2;
    --sans: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, 'Cascadia Mono', Consolas, monospace;
    --serif: 'Instrument Serif', Georgia, 'Times New Roman', serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { color-scheme: light; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--sans);
    font-size: 16px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  a { color: inherit; text-decoration: none; }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

  /* ---------- nav ---------- */
  .nav {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 22px 0;
    border-bottom: 1px solid var(--rule);
  }
  .wordmark { font-weight: 600; font-size: 17px; letter-spacing: -0.01em; }
  .links { display: flex; gap: 20px; font-family: var(--mono); font-size: 13px; }
  .links a { color: var(--ink); }
  .links a:hover { color: var(--accent); }
  .links a.active { color: var(--accent); }

  /* ---------- headline ---------- */
  .headline {
    font-family: var(--serif);
    font-weight: 400;
    font-size: clamp(38px, 6vw, 64px);
    line-height: 1.08;
    letter-spacing: -0.01em;
    text-align: center;
    max-width: 820px;
    margin: 72px auto 18px;
  }
  .headline i { font-style: italic; }
  .counts {
    font-family: var(--mono); font-size: 13px;
    text-align: center;
    display: flex; justify-content: center; gap: 18px;
    margin-bottom: 40px;
  }
  .counts .live { color: var(--accent); }
  .counts .surveyed { color: var(--mute); }

  /* ---------- map ---------- */
  .map-wrap {
    position: relative; overflow: hidden;
    background: var(--bg);
    border: 1px solid var(--rule);
    border-radius: 3px;
  }
  .map-wrap svg.map { display: block; width: 100%; height: auto; cursor: grab; touch-action: pan-y; }
  .map-wrap svg.map:active { cursor: grabbing; }
  .nation-fill { fill: var(--paper); stroke: none; }
  .county { fill: transparent; stroke: var(--rule); stroke-width: 0.3; }
  .county.surveyed { fill: var(--mute); fill-opacity: 0.3; stroke: var(--mute); stroke-width: 0.4; }
  .county.live { fill: var(--accent); stroke: var(--accent-dark); stroke-width: 0.5; }
  .county:hover { fill: var(--rule); }
  .county.surveyed:hover { fill: var(--mute); fill-opacity: 0.5; }
  .county.live:hover { fill: var(--accent-dark); }
  .state-line { fill: none; stroke: var(--rule); stroke-width: 0.7; pointer-events: none; }
  .nation-line { fill: none; stroke: var(--ink); stroke-width: 0.8; pointer-events: none; }
  .map-controls { position: absolute; top: 12px; right: 12px; display: flex; flex-direction: column; gap: 6px; }
  .map-controls button {
    width: 34px; height: 34px;
    border: 1px solid var(--ink); background: var(--paper); color: var(--ink);
    border-radius: 3px;
    font-family: var(--mono); font-size: 15px; cursor: pointer;
  }
  .map-controls button:hover { background: var(--btn); color: #fff; border-color: var(--btn); }
  .map-controls button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .legend {
    position: absolute; left: 12px; bottom: 12px;
    border: 1px solid var(--rule); background: var(--paper);
    border-radius: 3px;
    padding: 10px 14px;
    font-family: var(--mono); font-size: 11px; color: var(--ink);
    display: grid; gap: 6px;
  }
  .legend .row { display: flex; align-items: center; gap: 8px; }
  .legend .sw { width: 16px; height: 11px; border: 1px solid var(--rule); flex: none; }
  .sw.live { background: var(--accent); border-color: var(--accent-dark); }
  .sw.surveyed { background: rgba(107,107,107,0.3); border-color: var(--mute); }
  .sw.none { background: var(--paper); }
  .tooltip {
    position: absolute; pointer-events: none;
    border: 1px solid var(--ink); background: var(--paper);
    border-radius: 3px;
    padding: 8px 12px; display: none; max-width: 250px; z-index: 10;
    font-family: var(--mono); font-size: 12px; color: var(--ink);
  }
  .tooltip .t-name { font-weight: 500; }
  .tooltip .t-status { color: var(--mute); margin-top: 2px; }
  .tooltip .t-status.live { color: var(--accent); }

  /* ---------- stats ---------- */
  .stats {
    display: flex; justify-content: center; gap: 48px; flex-wrap: wrap;
    font-family: var(--mono);
    margin: 40px auto 0;
    text-align: center;
  }
  .stats .num { font-size: 28px; font-weight: 500; font-variant-numeric: tabular-nums; line-height: 1.1; }
  .stats .lbl { font-size: 11px; color: var(--mute); margin-top: 6px; }

  /* ---------- motto + footer ---------- */
  .motto {
    font-family: var(--mono); font-size: 12px; color: var(--mute);
    text-align: center;
    margin-top: 80px;
  }
  .motto a:hover { color: var(--accent); }
  .footer {
    font-family: var(--mono); font-size: 12px; color: var(--mute);
    text-align: center;
    border-top: 1px solid var(--rule);
    margin-top: 28px;
    padding: 28px 0 40px;
  }
  .footer a:hover { color: var(--accent); }
  .footer a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- responsive ---------- */
  @media (max-width: 720px) {
    .nav { flex-direction: column; align-items: flex-start; gap: 12px; }
    .links { gap: 14px; flex-wrap: wrap; }
    .headline { margin: 48px auto 14px; }
    .legend { position: static; border: none; border-top: 1px solid var(--rule); border-radius: 0; }
    .stats { gap: 28px; }
  }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">

  <nav class="nav" aria-label="Primary">
    <a class="wordmark" href="/">Fee Simple</a>
    <div class="links">
      <a href="/">[home]</a>
      <a href="/coverage.html" class="active" aria-current="page">[coverage]</a>
      <!-- demo temporarily unlinked: <a href="/demo/">[sample run]</a> -->
    </div>
  </nav>

  <h1 class="headline">coverage, <i>by county</i></h1>
  <div class="counts" id="counts"></div>

  <div class="map-wrap">
    <svg class="map" id="map" viewBox="0 0 975 610" role="img" aria-label="Map of United States county coverage"></svg>
    <div class="map-controls">
      <button id="zoom-in" aria-label="Zoom in">+</button>
      <button id="zoom-out" aria-label="Zoom out">−</button>
      <button id="zoom-reset" aria-label="Reset view to North Carolina">⌂</button>
    </div>
    <div class="legend">
      <div class="row"><span class="sw live"></span> live — in production</div>
      <div class="row"><span class="sw surveyed"></span> surveyed — bulk data mapped</div>
      <div class="row"><span class="sw none"></span> not yet covered</div>
    </div>
    <div class="tooltip" id="tooltip"></div>
  </div>

  <div class="stats" id="stats"></div>

  <p class="motto">
    <a href="https://www.nationalarchives.gov.uk/education/resources/domesday-book/" target="_blank" rel="noopener noreferrer">"One record, without appeal."</a>
  </p>

  <footer class="footer">
    Talos Operations LLC · <a href="mailto:info@talosoperations.com">info@talosoperations.com</a> · <a href="https://www.linkedin.com/company/talos_operations/" target="_blank" rel="me noopener noreferrer">LinkedIn</a>
  </footer>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<script src="/map-data.js"></script>
<script>
/* =====================================================================
   CONFIG — the only section you edit.
   Everything on the page derives from this object. Counters are computed,
   not typed twice, so the map and the numbers can never disagree.
   County keys are 5-digit FIPS codes (state 37 = North Carolina).
   status: "live" (accent) | "surveyed" (muted)
   ===================================================================== */
const CONFIG = {
  stats: {
    filesProcessed: 8742,       // retrieval runs (909 + 7,833)
    testsPassing: 6291,         // tests passing (881 + 5,410)
    instrumentsInCorpus: 182,   // unique deed instruments, hash-deduped
  },
  counties: {
    "37183": { name: "Wake", status: "live", since: "2026" },
    "37063": { name: "Durham", status: "live", since: "2026" },
    "37101": { name: "Johnston", status: "live", since: "2026" },
    "37077": { name: "Granville", status: "live", since: "2026" },
    "37085": { name: "Harnett", status: "live", since: "2026" },
    "37069": { name: "Franklin", status: "live", since: "2026" },
    "37053": { name: "Currituck", status: "live", since: "2026" },
    "37105": { name: "Lee", status: "live", since: "2026" },
    "37125": { name: "Moore", status: "live", since: "2026" },
    "37127": { name: "Nash", status: "live", since: "2026" },
    "37129": { name: "New Hanover", status: "live", since: "2026" },
    "37141": { name: "Pender", status: "live", since: "2026" },
    "37159": { name: "Rowan", status: "live", since: "2026" },
    "37163": { name: "Sampson", status: "live", since: "2026" },
    "37189": { name: "Watauga", status: "live", since: "2026" },
    "37193": { name: "Wilkes", status: "live", since: "2026" },
    "37185": { name: "Warren", status: "surveyed", since: "—" },
    "37033": { name: "Caswell", status: "surveyed", since: "—" },
    "37145": { name: "Person", status: "live", since: "2026" },
    "37197": { name: "Yadkin", status: "live", since: "2026" },
    "37057": { name: "Davidson", status: "live", since: "2026" },
    "37051": { name: "Cumberland", status: "live", since: "2026" },
    "37151": { name: "Randolph", status: "live", since: "2026" },
    "37195": { name: "Wilson", status: "surveyed", since: "—" },
    "37037": { name: "Chatham", status: "surveyed", since: "—" },
    "37081": { name: "Guilford", status: "live", since: "2026" },
    "37067": { name: "Forsyth", status: "live", since: "2026" },
    "37065": { name: "Edgecombe", status: "live", since: "2026" },
    "37109": { name: "Lincoln", status: "surveyed", since: "—" },
    "37131": { name: "Northampton", status: "surveyed", since: "—" },
    "37079": { name: "Greene", status: "surveyed", since: "—" },
    "37181": { name: "Vance", status: "surveyed", since: "—" },
    "37093": { name: "Hoke", status: "surveyed", since: "—" },
    "37169": { name: "Stokes", status: "live", since: "2026" },
    "37123": { name: "Montgomery", status: "surveyed", since: "—" },
    "37157": { name: "Rockingham", status: "surveyed", since: "—" },
    "37011": { name: "Avery", status: "surveyed", since: "—" },
    "37097": { name: "Iredell", status: "live", since: "2026" },
    "37031": { name: "Carteret", status: "surveyed", since: "—" },
    "37191": { name: "Wayne", status: "surveyed", since: "—" },
    "37019": { name: "Brunswick", status: "surveyed", since: "—" },
    "37133": { name: "Onslow", status: "surveyed", since: "—" },
    "37107": { name: "Lenoir", status: "surveyed", since: "—" },
    "37061": { name: "Duplin", status: "surveyed", since: "—" },
    "37027": { name: "Caldwell", status: "surveyed", since: "—" },
    "37023": { name: "Burke", status: "surveyed", since: "—" },
    "37111": { name: "McDowell", status: "surveyed", since: "—" },
    "37035": { name: "Catawba", status: "surveyed", since: "—" },
    "37147": { name: "Pitt", status: "surveyed", since: "—" },
    "37139": { name: "Pasquotank", status: "surveyed", since: "—" },
  },
};
/* ===================== end CONFIG ===================================== */

// ---- derived counts (single source of truth: CONFIG.counties) ----
const entries = Object.entries(CONFIG.counties);
const liveCount = entries.filter(([,c]) => c.status === "live").length;
const surveyedCount = entries.filter(([,c]) => c.status === "surveyed").length;

document.getElementById("counts").innerHTML =
  `<span class="live">[${liveCount} live]</span><span class="surveyed">[${surveyedCount} surveyed]</span>`;

const statsData = [
  { num: CONFIG.stats.filesProcessed, lbl: "retrieval runs" },
  { num: CONFIG.stats.instrumentsInCorpus, lbl: "instruments in corpus" },
  { num: CONFIG.stats.testsPassing, lbl: "tests passing" },
];
const stats = document.getElementById("stats");
statsData.forEach(d => {
  const cell = document.createElement("div");
  cell.innerHTML = `<div class="num">${d.num.toLocaleString()}</div><div class="lbl">${d.lbl}</div>`;
  stats.appendChild(cell);
});

const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
const coarsePointer = window.matchMedia("(pointer: coarse)").matches;

// ---- map ----
const svg = d3.select("#map");
const width = 975, height = 610;

const g = svg.append("g");
const path = d3.geoPath(); // topology is pre-projected (Albers USA)

const counties = topojson.feature(topology, topology.objects.counties).features;
const tooltip = document.getElementById("tooltip");
const mapWrap = document.querySelector(".map-wrap");

g.append("path")
  .datum(topojson.feature(topology, topology.objects.nation))
  .attr("class", "nation-fill")
  .attr("d", path);

g.selectAll("path.county")
  .data(counties)
  .join("path")
  .attr("class", d => {
    const c = CONFIG.counties[d.id];
    return "county" + (c ? " " + c.status : "");
  })
  .attr("d", path)
  .on("mousemove", (event, d) => {
    const c = CONFIG.counties[d.id];
    const rect = mapWrap.getBoundingClientRect();
    tooltip.style.display = "block";
    let x = event.clientX - rect.left + 14;
    let y = event.clientY - rect.top + 14;
    if (x > rect.width - 260) x -= 280;
    tooltip.style.left = x + "px";
    tooltip.style.top = y + "px";
    tooltip.innerHTML = `<div class="t-name">${d.properties.name} County</div>` +
      (c
        ? (c.status === "live"
            ? `<div class="t-status live">[live · since ${c.since}]</div>`
            : `<div class="t-status">[surveyed]</div>`)
        : `<div class="t-status">[not yet covered]</div>`);
  })
  .on("mouseleave", () => { tooltip.style.display = "none"; });
mapWrap.addEventListener("touchstart", (e) => {
  if (!(e.target instanceof Element) || !e.target.classList.contains("county")) tooltip.style.display = "none";
}, { passive: true });

g.append("path")
  .datum(topojson.mesh(topology, topology.objects.states, (a, b) => a !== b))
  .attr("class", "state-line")
  .attr("d", path);

g.append("path")
  .datum(topojson.feature(topology, topology.objects.nation))
  .attr("class", "nation-line")
  .attr("d", path);

const zoom = d3.zoom()
  .scaleExtent([1, 30])
  .translateExtent([[0, 0], [width, height]])
  .on("zoom", (event) => {
    g.attr("transform", event.transform);
    g.selectAll(".county").attr("stroke-width", 0.3 / event.transform.k * 1.4 + 0.08);
    g.select(".state-line").attr("stroke-width", 0.7 / Math.sqrt(event.transform.k));
    g.select(".nation-line").attr("stroke-width", 0.8 / Math.sqrt(event.transform.k));
  });
svg.call(zoom);

const ncCounties = counties.filter(d => d.id.startsWith("37"));
function fitBounds(features, scalePad) {
  const b = features.map(path.bounds).reduce((acc, bb) => [
    [Math.min(acc[0][0], bb[0][0]), Math.min(acc[0][1], bb[0][1])],
    [Math.max(acc[1][0], bb[1][0]), Math.max(acc[1][1], bb[1][1])],
  ]);
  const dx = b[1][0] - b[0][0], dy = b[1][1] - b[0][1];
  const cx = (b[0][0] + b[1][0]) / 2, cy = (b[0][1] + b[1][1]) / 2;
  const k = Math.min(30, scalePad / Math.max(dx / width, dy / height));
  return d3.zoomIdentity.translate(width / 2 - k * cx, height / 2 - k * cy).scale(k);
}
const ncTransform = fitBounds(ncCounties, 0.85);
if (reduceMotion || coarsePointer) {
  svg.call(zoom.transform, ncTransform);
} else {
  svg.transition().delay(500).duration(1600).call(zoom.transform, ncTransform);
}

document.getElementById("zoom-in").onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1.6);
document.getElementById("zoom-out").onclick = () => svg.transition().duration(300).call(zoom.scaleBy, 1 / 1.6);
document.getElementById("zoom-reset").onclick = () => svg.transition().duration(600).call(zoom.transform, ncTransform);
</script>
</body>
</html>
