<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Fee Simple — Hero directions</title><style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#15171b;color:#e5e9f0;font-family:system-ui,-apple-system,sans-serif}body{display:flex;flex-direction:column}.bar{min-height:76px;display:flex;gap:24px;align-items:center;padding:15px 25px;border-bottom:1px solid #363a43;flex-wrap:wrap}.brand{font-size:13px;font-weight:600;white-space:nowrap}.brand span{display:block;font-size:10px;font-weight:400;color:#8e96a5;margin-top:3px;letter-spacing:.4px}.tabs{display:flex;gap:4px;background:#242830;padding:4px;border-radius:9px}.tabs button{border:0;background:none;color:#a8b0bf;padding:9px 20px;border-radius:6px;font:500 12px system-ui;cursor:pointer}.tabs button[aria-selected=true]{background:#f0f2f7;color:#15171b}.actions{margin-left:auto;display:flex;gap:15px;align-items:center}.actions button,.actions a{font:12px system-ui;color:#b4bdcb;background:none;border:0;padding:6px;cursor:pointer;text-decoration:none}.actions a{color:#f0f2f7}.stage{flex:1;min-height:0;position:relative}.stage iframe{width:100%;height:100%;border:0;display:block;background:#050912}.caption{height:34px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:0 25px;background:#171a20;color:#8995a8;font-size:10px;border-top:1px solid #363a43}.caption strong{color:#c3cbd7;font-weight:400}.tabs button:focus-visible,.actions a:focus-visible,.actions button:focus-visible{outline:2px solid #79abff;outline-offset:3px}@media(max-width:700px){.bar{gap:12px;padding:12px;min-height:108px}.brand{font-size:12px}.tabs{order:3;width:100%;justify-content:center}.tabs button{flex:1;padding:8px 12px}.actions{gap:6px}.actions button,.actions a{font-size:10px}.caption{padding:0 12px;height:40px;font-size:9px}.caption span:last-child{display:none}}
</style></head><body><header class="bar"><div class="brand">Fee Simple<span>HERO DIRECTIONS</span></div><div class="tabs" role="tablist" aria-label="Design direction"><button role="tab" aria-selected="true" data-design="orbit">Orbit</button><button role="tab" aria-selected="false" data-design="daylight">Daylight</button><button role="tab" aria-selected="false" data-design="signal">Signal</button></div><div class="actions"><button id="pause" aria-pressed="false">Pause motion</button><a id="full" href="./orbit.html" target="_blank" rel="noopener">Full view ↗</a></div></header><main class="stage"><iframe src="./orbit.html" title="Orbit hero concept" id="preview"></iframe></main><footer class="caption"><span id="description"><strong>Orbit</strong> — Oversized globe. Cinematic blue. Confident typography.</span><span>Three working concepts · Current website unchanged</span></footer><script>
const descriptions={orbit:'Oversized globe. Cinematic blue. Confident typography.',daylight:'Bright surfaces. Electric blue. Records brought into focus.',signal:'Orbital scanning. Precise details. Property intelligence.'};const preview=document.querySelector('#preview');let paused=false;
function select(name){if(!descriptions[name])name='orbit';document.querySelectorAll('[data-design]').forEach(button=>button.setAttribute('aria-selected',String(button.dataset.design===name)));preview.src='./'+name+'.html';preview.title=name[0].toUpperCase()+name.slice(1)+' hero concept';document.querySelector('#full').href='./'+name+'.html';document.querySelector('#description').textContent=name[0].toUpperCase()+name.slice(1)+' — '+descriptions[name];history.replaceState(null,'','#'+name)}
document.querySelectorAll('[data-design]').forEach((button,index)=>{button.onclick=()=>select(button.dataset.design);button.onkeydown=event=>{if(!['ArrowLeft','ArrowRight'].includes(event.key))return;event.preventDefault();const buttons=[...document.querySelectorAll('[data-design]')];const next=buttons[(index+(event.key==='ArrowRight'?1:2))%3];next.focus();select(next.dataset.design)}});document.querySelector('#pause').onclick=()=>{paused=!paused;document.querySelector('#pause').textContent=paused?'Play motion':'Pause motion';document.querySelector('#pause').setAttribute('aria-pressed',String(paused));preview.contentWindow.postMessage({type:'motion',paused},location.origin)};preview.onload=()=>preview.contentWindow.postMessage({type:'motion',paused},location.origin);if(location.hash)select(location.hash.slice(1));
</script></body></html>
